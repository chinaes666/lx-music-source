name: Auto Update and Deploy LX Source

on:
  schedule:
    - cron: '0 */6 * * *' # 每隔 6 小时自动运行一次
  workflow_dispatch: # 允许在 GitHub 后台手动点击运行

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run Build Script
        run: |
          python build.py # 运行你的脚本，生成 source.js 存放在根目录
          
      - name: Publish to Cloudflare Pages via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=lx-music-source --branch=main --commit-dirty=true
